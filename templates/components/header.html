
<header>

    <img src="{{ url_for('static', filename='images/logo.png') }}"
         width="50px"
         height="50px"
         alt="Logo">

    <h1>{{ site_name }}</h1>

    <nav>
        <ul>

            <li>
                <a href="{{ url_for('main.home_view') }}"
                   class="{% if page == 'home' %}active{% endif %}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('main.service_view') }}"
                   class="{% if page == 'service' %}active{% endif %}">
                    Service
                </a>
            </li>

            <li>
                <a href="{{ url_for('main.about_view') }}"
                   class="{% if page == 'about' %}active{% endif %}">
                    À propos
                </a>
            </li>

            <li>
                <a href="{{ url_for('main.contact_view') }}"
                   class="{% if page == 'contact' %}active{% endif %}">
                    Contact
                </a>
            </li>

            <!-- Bouton Connexion -->
            <li>
                <a
                    href="{{ url_for('auth.login_view') }}"
                    class="btn btn-login"
                >
                    Connexion
                </a>
            </li>

            <!-- Bouton Inscription -->
            <li>
                <a
                    href="{{ url_for('auth.register_view') }}"
                    class="btn btn-register"
                >
                    Inscription
                </a>
            </li>

        </ul>
    </nav>

</header>
