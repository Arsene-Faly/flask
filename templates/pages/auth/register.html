{% extends "layouts/base.html" %}

{% block title %}
Inscription
{% endblock %}

{% block content %}

<h1>Créer un compte</h1>

<p>
    Inscrivez-vous pour créer votre compte.
</p>

<form method="POST">

    <div>
        <label for="email">Email :</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div>
        <label for="password">Mot de passe :</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <div>
        <label for="password_confirm">Confirmer le mot de passe :</label>
        <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            required
        >
    </div>

    <button type="submit">
        S'inscrire
    </button>

</form>

<p>
    Vous avez déjà un compte ?
    <a href="{{ url_for('auth.login_view') }}">
        Se connecter
    </a>
</p>

{% endblock %}
