{% extends "layouts/base.html" %}

{% block title %}
Connexion
{% endblock %}

{% block content %}

<h1>Se connecter</h1>

<p>
    Connectez-vous à votre compte.
</p>

<form method="POST">

    <div>
        <label for="email">Email :</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div>
        <label for="password">Mot de passe :</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <button type="submit">
        Se connecter
    </button>

</form>

<p>
    Vous n'avez pas encore de compte ?
    <a href="{{ url_for('auth.register_view') }}">
        S'inscrire
    </a>
</p>

{% endblock %}
