{% extends "layouts/base_admin.html" %}

{% block title %}
Category details
{% endblock %}


{% block content %}

<div class="page-header">

    <h2>Détails de la catégorie</h2>

</div>


<div class="card">

    <div class="detail-item">

        <strong>Nom</strong>

        <p>
            {{ category.name }}
        </p>

    </div>


    <div class="detail-item">

        <strong>Description</strong>

        <p>
            {{ category.description }}
        </p>

    </div>


    <div class="actions">

        <a
            href=""
            class="btn btn-edit"
        >
            <i class="fa-solid fa-pen"></i>
            Modifier
        </a>

        <a
            href="{{ url_for('admin_category.category_list')}}"
            class="btn btn-view"
        >
            Retour
        </a>

    </div>

</div>

{% endblock %}
